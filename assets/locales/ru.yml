update_prompt_dialog:
  title: "Доступно обновление"
  content: |
    Доступна новая версия Hachimi Edge (%{version}). Хотите её установить?
    Игра перезапустится, чтобы применить изменения.
  android_content: |
    Доступна новая версия Hachimi Edge (%{version}).

    Нажмите Да, чтобы открыть UmaPatcher Edge, затем пропатчите игру, как обычно.
    Заново скачивать игру или APK не требуется.

